name: Plone package

# Every action is pinned to a full commit SHA of a release that has been out
# for at least two weeks (cooldown). The comment after each SHA is the tag.
# Container images are pinned by digest in the same way.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml runs the tests of the release commit before it builds.
  workflow_call:
    inputs:
      ref:
        description: The commit to test (empty for the commit of the run)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs of the same PR only.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install tox
        run: python -m pip install tox
      - name: Ruff
        run: tox -e ruff-check

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install tox
        run: python -m pip install tox
      - name: Mypy
        run: tox -e mypy

  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # java/build.sh uses the pinned Maven image, not the runner's Maven
      # and JDK, so the jar must be the same as the committed one.
      - name: Build the jar
        run: java/build.sh "$RUNNER_TEMP/msdoc2txt.jar"
      - name: Compare with the committed jar
        run: |
          sha256sum src/c2/transform/msoffice/msdoc2txt.jar "$RUNNER_TEMP/msdoc2txt.jar"
          cmp src/c2/transform/msoffice/msdoc2txt.jar "$RUNNER_TEMP/msdoc2txt.jar"
      # eclipse-temurin:11.0.32_9-jre-noble
      - name: Check the output with Java 11
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src:ro -w /src
          eclipse-temurin@sha256:e69ed7d96d8e2a174057ee33cc3a4bb54c5b172dd24d41c22c032789d7bdef9b
          java/check-output.sh src/c2/transform/msoffice/msdoc2txt.jar
      # eclipse-temurin:21.0.12_8-jre-noble
      - name: Check the output with Java 21
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src:ro -w /src
          eclipse-temurin@sha256:7739f0ffce786528961eea6bf46d9610ee968ac6127c9b2e93494757bdecce9f
          java/check-output.sh src/c2/transform/msoffice/msdoc2txt.jar

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python-version: '3.10', tox-env: 'py310-Plone60'}
          - {python-version: '3.11', tox-env: 'py311-Plone60'}
          - {python-version: '3.12', tox-env: 'py312-Plone60'}
          - {python-version: '3.13', tox-env: 'py313-Plone60'}
          - {python-version: '3.10', tox-env: 'py310-Plone61'}
          - {python-version: '3.11', tox-env: 'py311-Plone61'}
          - {python-version: '3.12', tox-env: 'py312-Plone61'}
          - {python-version: '3.13', tox-env: 'py313-Plone61'}
          - {python-version: '3.10', tox-env: 'py310-Plone62'}
          - {python-version: '3.11', tox-env: 'py311-Plone62'}
          - {python-version: '3.12', tox-env: 'py312-Plone62'}
          - {python-version: '3.13', tox-env: 'py313-Plone62'}
          - {python-version: '3.14', tox-env: 'py314-Plone62'}
    env:
      # Fail instead of skipping the tests that need java.
      C2_TRANSFORM_MSOFFICE_REQUIRE_JAVA: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # The runner has several JDKs already; this pins the one on PATH.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install tox
        run: python -m pip install tox
      - name: Test with tox
        run: |
          set -o pipefail
          tox -e ${{ matrix.tox-env }} | tee tox.log
      - name: Check that no test was skipped
        run: |
          if grep -E '^SKIPPED|[0-9]+ skipped' tox.log; then
            echo "::error::Some tests were skipped"
            exit 1
          fi
